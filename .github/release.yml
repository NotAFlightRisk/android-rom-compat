# Controls GitHub's auto-generated release notes.
# Docs: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - question
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking-change
    - title: 🔒 Security
      labels:
        - security
    - title: 📱 Devices
      labels:
        - new-device
        - device
        - bootloader
    - title: 🧪 What Works
      labels:
        - feature-status
    - title: 🧩 ROMs
      labels:
        - rom
        - import
    - title: 🛠️ Site and Code
      labels:
        - ui
        - api
        - scripts
        - documentation
        - maintenance
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🧹 Other Changes
      labels:
        - "*"
