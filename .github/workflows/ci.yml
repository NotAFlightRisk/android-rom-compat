name: 🚦 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.emoji }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: data
            emoji: 📋
            run: npm run validate
          - label: tests
            emoji: 🧪
            run: npm test
          - label: build
            emoji: 🏗️
            run: npm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  image:
    name: 🐋 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: android-rom-compat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve it and see if it answers
        run: |
          docker run -d --name ci -p 8080:8080 android-rom-compat:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/devices/ > /dev/null; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs ci
          exit 1
