# yaml-language-server: $schema=../../../schema/device.json
name: BraX3
codenames: [brax3]
released: 2025
soc: MediaTek Dimensity 6300
hardware: [5g, cellular, esim, fingerprint, nfc]
bootloader:
  unlock: yes
  notes: Unlocks with fastboot, though Brax warns OTA updates can then fail and you'd update by flashing full firmware instead.
  source: https://opensource.braxtech.net/Technical%20Guides/guides/unlock-bootloader/
relock:
  custom_key: unknown
  notes: It ships with iodéOS, so iodéOS relocking it doesn't show it takes anyone else's key.
  source: https://blog.iode.tech/brax3-privacy-phone-available-for-pre-order-with-iodeos/
