# yaml-language-server: $schema=../../schema/rom.json
name: GrapheneOS
description: Security-hardened Android for Pixels, with Google Play as an optional, sandboxed app.
status: active
base: aosp
focus: [security, privacy]
google: sandboxed
app_store: grapheneos
org: non-profit
security:
  relockable_bootloader: true
  verified_boot: true
  patches: monthly
install: [web-installer, cli]
root: false
links:
  website: https://grapheneos.org
  source: https://github.com/GrapheneOS
  docs: https://grapheneos.org/usage
  community: https://discuss.grapheneos.org
features:
  volte: { status: working, note: On carriers Google supports for Pixels, source: https://grapheneos.org/usage#carrier-functionality }
  vowifi: { status: partial, note: "Varies by carrier, as some need Google apps GrapheneOS doesn't ship", source: https://grapheneos.org/usage#carrier-functionality }
  5g: { status: working, note: On carriers Google supports for Pixels, source: https://grapheneos.org/usage#carrier-functionality }
  wallet: { status: broken, inferred: true, note: "Tap-to-pay needs a Play Integrity verdict GrapheneOS doesn't get", source: https://grapheneos.org/articles/attestation-compatibility-guide }
  push: { status: working, note: Through sandboxed Google Play, source: https://grapheneos.org/usage#sandboxed-google-play-installation }
  android_auto: { status: working, note: 'Wired and wireless, through sandboxed Google Play', source: https://grapheneos.org/usage#android-auto }
  rcs: { status: working, note: 'With sandboxed Google Play, only known to work in the owner profile', source: https://grapheneos.org/usage#rcs }
  integrity: { status: basic, inferred: true, note: 'The docs only cover the retired SafetyNet, where it passes the basic check but not the certified one', source: https://grapheneos.org/usage#banking-apps }
  fingerprint: { status: working, note: 'Five failed tries turns it off until you unlock with your PIN or password', source: https://grapheneos.org/features#more-secure-fingerprint-unlock }
  esim: { status: working, note: 'Switch on eSIM support in Settings first, it''s off by default', source: https://grapheneos.org/usage#esim-support }
