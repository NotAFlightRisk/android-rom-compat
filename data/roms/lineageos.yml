# yaml-language-server: $schema=../../schema/rom.json
name: LineageOS
description: The biggest community ROM, running on hundreds of devices. Ships without Google apps, which you can add yourself.
status: active
base: aosp
focus: [customisation, near-stock]
google: optional
app_store: none
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://lineageos.org
  source: https://github.com/LineageOS
  docs: https://wiki.lineageos.org
  community: https://lineageos.org/community/
features:
  wallet: { status: broken, inferred: true, note: "Tap-to-pay needs a Play Integrity verdict LineageOS doesn't promise", source: https://wiki.lineageos.org/faq#my-device-doesnt-pass-play-integrity }
  push: { status: partial, note: Needs Google apps or microG added yourself, source: https://wiki.lineageos.org/faq#my-notifications-do-not-work }
  android_auto: { status: partial, inferred: true, note: 'Needs Google apps added yourself, and the MindTheGapps package LineageOS links to has it', source: https://gitlab.com/MindTheGapps/vendor_gapps/-/tree/cinnamonbun/common/proprietary/product/priv-app/AndroidAutoStub }
  fingerprint: { status: working, inferred: true, note: Official builds have to support it on phones that came with Android 6 or later, source: https://github.com/LineageOS/charter/blob/main/device-support-requirements.md#fingerprint-sensor }
  nfc: { status: working, inferred: true, note: Official builds have to support it wherever stock did, source: https://github.com/LineageOS/charter/blob/main/device-support-requirements.md#nfc }
  bluetooth_audio: { status: working, inferred: true, note: "Official builds have to support it, though aptX isn't guaranteed", source: https://github.com/LineageOS/charter/blob/main/device-support-requirements.md#audio }
variants:
  - key: microg
    name: LineageOS for microG
    google: microg
    links: { website: https://lineage.microg.org }
    features:
      push: { status: working, note: 'Through microG, switch it on in microG settings', source: https://github.com/lineageos4microg/l4m-wiki/wiki/Installation }
