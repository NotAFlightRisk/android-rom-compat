# yaml-language-server: $schema=../../schema/rom.json
name: crDroid
description: LineageOS-based ROM packed with extra customisation options, with Google apps as an optional add-on.
status: active
base: lineageos
focus: [customisation, performance]
google: optional
app_store: none
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://crdroid.net
  source: https://github.com/crdroidandroid
features:
  wallet: { status: broken, inferred: true, note: "Google says tap-to-pay doesn't run on custom ROMs or unlocked bootloaders", source: https://support.google.com/wallet/answer/12200245 }
  push: { status: partial, inferred: true, note: 'Official builds ship without Google apps, add them yourself', source: https://github.com/crdroidandroid/rules-and-guidelines#software }
  fingerprint: { status: working, inferred: true, note: Official builds have to support it, source: https://github.com/crdroidandroid/rules-and-guidelines#fingerprint }
  bluetooth_audio: { status: working, inferred: true, note: Official builds have to support every audio output stock did, source: https://github.com/crdroidandroid/rules-and-guidelines#audio }
