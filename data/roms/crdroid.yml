# yaml-language-server: $schema=../../schema/rom.json
name: crDroid
description: LineageOS-based ROM packed with extra customisation options, with Google apps as an optional add-on.
status: active
base: lineageos
focus: [customisation, performance]
google: optional
app_store: none
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://crdroid.net
  source: https://github.com/crdroidandroid
features:
  push: { status: partial, inferred: true, note: 'Official builds ship without Google apps, add them yourself', source: https://github.com/crdroidandroid/rules-and-guidelines#software }
