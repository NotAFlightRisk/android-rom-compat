# yaml-language-server: $schema=../../schema/rom.json
name: RisingOS Revived
description: LineageOS-based ROM with heavy customisation, in builds with full or slimmed-down Google apps, microG, or none at all.
status: active
base: lineageos
focus: [customisation]
google: bundled
app_store: play-store
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://risingos-revived-devices.github.io
  source: https://github.com/RisingOS-Revived
  community: https://t.me/RisingOSRevived
features:
  wallet: { status: broken, inferred: true, note: "Google says tap-to-pay doesn't run on custom ROMs or unlocked bootloaders", source: https://support.google.com/wallet/answer/12200245 }
  push: { status: working, inferred: true, note: 'Google apps or microG come built in, except on the VANILLA builds', source: https://github.com/RisingOS-Revived/android_vendor_lineage/blob/21a1e29ea7def2a91516570abbaa6f9ffe023517/config/common_full_phone.mk#L12-L20 }
  android_auto: { status: working, inferred: true, note: 'Comes with the built-in Google apps, so not on the VANILLA or MICROG builds', source: https://github.com/RisingOS-Revived/android_vendor_gms/blob/619534d5a9880377697935d1978d871ec1af71b7/gms_pico.mk#L52 }
