# yaml-language-server: $schema=../../schema/rom.json
name: CalyxOS
description: Privacy-focused Android from the Calyx Institute, with optional microG and a relockable bootloader.
status: active
base: aosp
focus: [privacy, security]
google: microg
app_store: fdroid
org: non-profit
security:
  relockable_bootloader: true
  verified_boot: true
  patches: monthly
install: [web-installer, cli]
root: false
links:
  website: https://calyxos.org
  source: https://gitlab.com/CalyxOS
  docs: https://calyxos.org/docs/
  community: https://calyxos.org/community/
features:
  wallet: { status: broken, note: "Google Wallet and most other payment apps don't work", source: https://calyxos.org/docs/guide/getting-started/#calyxos-limitations---calyxos-versus-stock-android }
  push: { status: working, note: 'Through microG, on by default', source: https://calyxos.org/docs/guide/microg/ }
