# yaml-language-server: $schema=../../schema/rom.json
name: Lunaris AOSP
description: LineageOS-based ROM made of features picked from crDroid, Evolution X, AxionOS and others, with Google apps built in, or left out on its vanilla builds.
status: active
base: lineageos
focus: [customisation, performance]
google: bundled
app_store: play-store
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://github.com/Lunaris-AOSP
  source: https://github.com/Lunaris-AOSP/android
  community: https://t.me/lunaris_hub
features:
  wallet: { status: broken, inferred: true, note: "Google says tap-to-pay doesn't run on custom ROMs or unlocked bootloaders", source: https://support.google.com/wallet/answer/12200245 }
  push: { status: working, inferred: true, note: 'Google apps come built in, except on the vanilla builds', source: https://github.com/Lunaris-AOSP/vendor_lineage/blob/a73cfc59df8692ef15665bb152ce01f8fb0c736e/config/common.mk#L341-L346 }
  android_auto: { status: working, inferred: true, note: 'Comes with the built-in Google apps, except on the vanilla builds', source: https://gitlab.com/GhosutoX/vendor_pixel_gms/-/blob/d5dcba95e2a2f06b5922d62c2adef6ff7a1caff3/common/common-vendor.mk#L137 }
