# yaml-language-server: $schema=../../schema/rom.json
name: AxionOS
description: LineageOS-based ROM tuned for speed rather than piles of options, with Google apps built in, or left out on its vanilla builds.
status: active
base: lineageos
focus: [performance, near-stock]
google: bundled
app_store: play-store
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://www.axionos.org
  source: https://github.com/AxionAOSP
  community: https://t.me/AxionOS_android_chat
features:
  wallet: { status: broken, inferred: true, note: "Google says tap-to-pay doesn't run on custom ROMs or unlocked bootloaders", source: https://support.google.com/wallet/answer/12200245 }
  push: { status: working, inferred: true, note: 'Google apps come built in, except on the vanilla builds', source: https://github.com/AxionAOSP/official_devices/tree/main/OTA/GMS }
