  push: { status: working, inferred: true, note: Google apps come built in, source: https://github.com/DerpFest-AOSP/android_vendor_derpfest/blob/d06277fee6daf0e64a109eb8a88ce66dbfa71fdb/config/derpfest.mk#L124-L125 }
  android_auto: { status: working, inferred: true, note: Comes with the built-in Google apps, source: https://gitlab.com/pixelos-aosp/proprietary_vendor_pixel_gms-17/-/blob/7feb3322ac4a0849f32d8b95e565e73cf6774a20/common/common-vendor.mk#L149 }
