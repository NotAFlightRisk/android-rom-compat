status: active
base: lineageos
focus: [customisation]
google: bundled
app_store: play-store
org: community
security:
  relockable_bootloader: false
  verified_boot: false
  patches: best-effort
install: [recovery]
root: false
links:
  website: https://derpfest.org
  source: https://github.com/DerpFest-AOSP
  community: https://t.me/DerpFestAOSP
